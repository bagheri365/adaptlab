[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptlab"
version = "0.1.0"
description = "Deterministic synthetic benchmark foundation for AdaptLab Milestone 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
adaptlab = "adaptlab.cli.main:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
